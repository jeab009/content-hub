name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Guards the review boundary — see scripts/check-review-authorship.sh and
  # errorlog.md P6-PROC-1. A review document committed alongside the source it
  # reviews cannot be independent, so it is rejected mechanically rather than
  # left to trust.
  review-authorship:
    name: Review authorship (no self-review commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commits in this push / PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Checking range: $RANGE"
          ./scripts/check-review-authorship.sh "$RANGE"

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: content_hub
          POSTGRES_PASSWORD: content_hub
          POSTGRES_DB: content_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://content_hub:content_hub@localhost:5432/content_hub?schema=public
      CORS_ORIGIN: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_QUEUE_DB: 0
      REDIS_SESSION_DB: 1
      SESSION_SECRET: ci-only-session-secret-not-a-real-secret-0123456789
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      FACEBOOK_APP_ID: ci-placeholder-app-id
      FACEBOOK_APP_SECRET: ci-placeholder-app-secret
      FACEBOOK_REDIRECT_URI: http://localhost:4000/api/connected-accounts/facebook/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma generate
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  # Phase 6 WP 6.0.8 — the real-database separation proof (exit criterion #6).
  #
  # ITS OWN JOB, ON PURPOSE (System Analyst condition B2). The unit job above
  # runs 400+ specs; a separation failure buried among them reads as "one red
  # dot", not as "the commerce/payout boundary is broken". As a named job the
  # failure is legible from the PR checks list without opening a log.
  #
  # It also runs against a database the unit job never touches, because this
  # suite TRUNCATES every table between runs — sharing a database with the unit
  # job would be a race waiting to happen. `POSTGRES_DB` must stay named
  # `*_e2e`: `src/testing/e2e/e2e-database.ts` refuses to truncate anything
  # else (BUG-P6-01).
  #
  # NO `redis` SERVICE HERE, DELIBERATELY (DevOps DEVOPS-2, resolved).
  # This job needs none. The suite never boots the Nest application:
  # `src/testing/e2e/capture-baseline.ts` constructs the five services it
  # exercises by hand (`new RankingEngineV2Service(...)`, `new
  # DashboardService(prisma)`, `new ReportExportService(prisma)`, `new
  # AuditLogService(prisma)`) over a bare `PrismaClient`. None of those
  # classes, nor `PrismaService`, references Bull/ioredis/`@InjectQueue` —
  # verified by grep. Adding a redis service would be cargo cult; if a future
  # e2e spec ever calls `Test.createTestingModule({ imports: [AppModule] })`,
  # add one then, because the queue module does connect on boot.
  separation-e2e:
    name: Backend (commerce/payout separation, real DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: content_hub
          POSTGRES_PASSWORD: content_hub
          POSTGRES_DB: content_hub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U content_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://content_hub:content_hub@localhost:5432/content_hub_e2e?schema=public
      # v2 is the engine that consumes real per-pillar earnings, so it is the
      # one whose scores could in principle be contaminated by commerce money.
      # Ranking under v1 would be a weaker proof.
      RANKING_ENGINE: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Separation e2e (byte-identity proof + live DB constraints)
        run: npm run test:e2e

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
