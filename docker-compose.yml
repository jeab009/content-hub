# Content Hub — one-command local/demo stack.
#
# This is a DEMO deployment path, not a production one: single replica per
# service, no TLS termination, secrets come from a local .env file. See
# README.md "Demo deployment via Docker Compose" and the Deployment Report
# for the full explanation of why this is not production-ready as-is.
#
# Usage:
#   cp .env.docker.example .env   # then fill in real secrets
#   docker compose up --build
#   open http://localhost:3000
#
# Admin password: on first boot, if SEED_ADMIN_PASSWORD is unset in .env, a
# random password is generated and printed once to the backend container's
# logs — `docker compose logs backend | grep -A3 "Generated admin password"`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-content_hub}
      POSTGRES_DB: ${POSTGRES_DB:-content_hub}
    volumes:
      - content-hub-pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-content_hub}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Defaults keep `docker compose up` on a laptop working exactly as
      # before. Override in .env when deploying to a real host — every value
      # below that mentions a browser-reachable URL has to change together
      # (CORS_ORIGIN, both OAuth redirect URIs, and the frontend's
      # NEXT_PUBLIC_API_BASE_URL build arg), because they all describe the
      # same two origins from the browser's point of view.
      #
      # NODE_ENV=production turns on the session cookie's Secure flag, so it
      # REQUIRES HTTPS end to end — setting it while serving over plain HTTP
      # silently breaks login (the browser refuses to send the cookie back).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # In-network service names, NOT localhost — this is the one place the
      # "docker run -e ... localhost" instructions in the older README quick
      # start don't apply, because these vars are read by a process running
      # inside the backend container, not on the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-content_hub}:${POSTGRES_PASSWORD:-content_hub}@postgres:5432/${POSTGRES_DB:-content_hub}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE_DB: 0
      REDIS_SESSION_DB: 1
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env — see .env.docker.example}
      SESSION_COOKIE_NAME: content_hub_sid
      SESSION_TTL_MS: 43200000
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY must be set in .env — see .env.docker.example}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-demo-app-id-replace-me}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-demo-app-secret-replace-me}
      # Must be reachable from the browser (host), matches the published
      # port below — NOT the in-network "backend" hostname.
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-http://localhost:4000/api/connected-accounts/facebook/callback}
      FACEBOOK_GRAPH_API_VERSION: v21.0
      FACEBOOK_OAUTH_SCOPES: pages_show_list,pages_read_engagement,pages_manage_posts
      # Blank default is deliberate (mirrors backend/.env.example): the app
      # boots fine unconfigured, the connect flow just 409s with a clear
      # "not configured" message until real Google Cloud OAuth credentials
      # are set in .env — see GoogleOAuthApiClient.assertConfigured().
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Must be reachable from the browser (host), matches the published
      # port below — NOT the in-network "backend" hostname (same reasoning
      # as FACEBOOK_REDIRECT_URI above).
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/connected-accounts/google/callback}
      GOOGLE_OAUTH_SCOPES: https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly
      # Publisher safety flags — all four MUST stay "mock" outside an explicit
      # production opt-in; the backend refuses to boot otherwise (see
      # assertPublisherFlagsAreSafe in backend/src/main.ts). TikTok/LINE live
      # paths are unverified stubs — the delivered path for those two is the
      # manual-external-record endpoint.
      PUBLISHER_IMPL_FACEBOOK: ${PUBLISHER_IMPL_FACEBOOK:-mock}
      PUBLISHER_IMPL_YOUTUBE: ${PUBLISHER_IMPL_YOUTUBE:-mock}
      PUBLISHER_IMPL_TIKTOK: ${PUBLISHER_IMPL_TIKTOK:-mock}
      PUBLISHER_IMPL_LINE: ${PUBLISHER_IMPL_LINE:-mock}
      # Ranking engine selector: v1 (frozen, FB/YT) | v2 (5 factors, 4 platforms).
      RANKING_ENGINE: ${RANKING_ENGINE:-v2}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Content Hub Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time only (see frontend/Dockerfile) — browser-reachable
        # backend URL, not the in-network "backend" hostname. Because Next.js
        # inlines NEXT_PUBLIC_* at build time, changing this in .env has NO
        # effect until the frontend image is rebuilt (`docker compose build
        # frontend`), unlike the backend vars above which apply on restart.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  content-hub-pgdata:
